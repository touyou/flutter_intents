name: Feature request
description: Suggest a new capability or enhancement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an idea! Please describe the problem you're trying to solve
        before jumping to the implementation — it helps us evaluate alternatives.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What can't you currently do, or what is awkward today?
      placeholder: |
        I want to expose entity properties to Spotlight so users can search ... ,
        but there is no annotation for ... .
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Sketch the API or the developer experience.
      placeholder: |
        Add a `@Property` annotation that ... .
        ```dart
        @EntitySpec(...)
        class TaskEntitySpec extends EntitySpecBase<Task> {
          @Property(title: 'Title')
          String title(Task task) => task.title;
        }
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or thought about.

  - type: dropdown
    id: platform
    attributes:
      label: Target platform(s)
      multiple: true
      options:
        - iOS
        - Android
        - Codegen / Dart API
        - Docs / tooling
    validations:
      required: true

  - type: input
    id: apple_docs
    attributes:
      label: Apple developer documentation link
      description: If this maps to an iOS App Intents / Shortcuts / SiriKit API, paste the URL here.
      placeholder: https://developer.apple.com/documentation/appintents/...

  - type: input
    id: android_docs
    attributes:
      label: Android developer documentation link
      description: If this maps to an Android AppFunctions / Gemini API, paste the URL here.
      placeholder: https://developer.android.com/...

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Related issues, screenshots, prior art in other plugins, etc.
